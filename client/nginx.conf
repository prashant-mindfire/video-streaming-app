server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve React static files, fallback to index.html for client-side routing
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the Node/Express container
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream HLS .ts chunks directly without buffering to Nginx disk
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
