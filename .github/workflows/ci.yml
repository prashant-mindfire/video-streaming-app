name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  server-ci:
    name: Server Lint, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: |
          npm run lint --if-present
          npm run typecheck --if-present

      - name: Build server
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage --if-present

  client-ci:
    name: Client Lint, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: |
          npm run lint --if-present
          npm run typecheck --if-present

      - name: Build client
        env:
          VITE_API_URL: http://localhost:5000
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage --if-present

  docker-build:
    name: Build Production Docker Images
    runs-on: ubuntu-latest
    needs: [server-ci, client-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: video-streaming-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Video Worker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile.worker
          push: false
          tags: video-streaming-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          build-args: |
            VITE_API_URL=http://localhost:5000
          tags: video-streaming-client:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
