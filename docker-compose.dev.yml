# docker-compose.dev.yml

services:
  # Backend
  server:
    image: video-streaming-server:dev
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev:docker
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs_init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
      args:
        VITE_API_URL: ${VITE_API_URL}
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev
    ports:
      - "3000:3001"
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

  # Outbox runner
  outbox:
    image: video-streaming-server:dev
    pull_policy: never
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev-docker:outbox
    env_file:
      - ./.env.dev
    depends_on:
      server:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Video processing worker
  worker:
    image: video-streaming-server:dev
    pull_policy: never
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev-docker:worker
    env_file:
      - ./.env.dev
    depends_on:
      server:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    ports:
      # AMQP protocol port (used by applications to send/receive messages)
      - "5672:5672"
      # Management UI web console port
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      # Persists RabbitMQ data so it survives container restarts
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis in-memory cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis insight GUI
  redisinsight:
    image: redis/redisinsight:latest
    profiles: ["debug"]
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # RustFs Permission Fixer (Runs once before RustFs starts)
  rustfs_perms:
    image: alpine
    user: root
    volumes:
      # Mount the parent root of the volumes so it fixes permissions for both subfolders at once
      - rustfs_root:/fix_path
    command: chown -R 10001:10001 /fix_path

  # RustFs object storage
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000" # MinIO/S3 API Replacement
      - "9001:9001" # RustFs Web Console
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    volumes:
      # Map subdirectories from the same named volume to preserve permissions cleanly
      - rustfs_root:/data
      - rustfs_root:/var/log/rustfs/
    environment:
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_OBS_LOGGER_LEVEL=error
      - RUSTFS_OBS_LOG_DIRECTORY=/var/log/rustfs/
      # Mandatory security credentials required to log in and allow backend access
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}

  # RustFS Automated Bucket Initialization (Runs once on first boot)
  rustfs_init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do
        echo 'Waiting for RustFS to be ready...';
        sleep 2;
      done;
      aws --endpoint-url http://rustfs:9000 s3 mb s3://${RUSTFS_BUCKET_NAME} || true;
      echo 'RustFS bucket (${RUSTFS_BUCKET_NAME}) initialization complete.';
      "

volumes:
  pgdata:
    external: true
  rabbitmq_data:
  redis_data:
  redisinsight_data:
  rustfs_root:
