# docker-compose.dev.yml

services:
  # Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
      # - minio
      - rustfs
      - rustfs_perms

  # Frontend    
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev
    ports:
      - "3000:3000"
    depends_on:
      - server
  
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis in-memory cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # MinIO object storage
  # minio:
  #   image: quay.io/minio/minio:latest 
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  #   command: server /data --console-address ":9001"
  #   ports:
  #     - "9000:9000" # MinIO API
  #     - "9001:9001" # MinIO Console
  #   volumes:
  #     - minio_data:/data

   # RustFs Permission Fixer (Runs once before RustFs starts)
  rustfs_perms:
    image: alpine
    user: root
    volumes:
      # Mount the parent root of the volumes so it fixes permissions for both subfolders at once
      - rustfs_root:/fix_path
    command: chown -R 10001:10001 /fix_path

  # RustFs object storage
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000" # MinIO/S3 API Replacement
      - "9001:9001" # RustFs Web Console
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    volumes:
      # Map subdirectories from the same named volume to preserve permissions cleanly
      - rustfs_root:/data
      - rustfs_root:/var/log/rustfs/
    environment:
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_OBS_LOGGER_LEVEL=error
      - RUSTFS_OBS_LOG_DIRECTORY=/var/log/rustfs/
      # Mandatory security credentials required to log in and allow backend access
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}

volumes:
  pgdata:
  # minio_data:
  rustfs_root: