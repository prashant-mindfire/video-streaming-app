# docker-compose.dev.yml

services:
  # Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
      - minio

  # Frontend    
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev
    ports:
      - "3000:3000"
    depends_on:
      - server
  
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis in-memory cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # MinIO object storage
  # minio:
  #   image: alpine/minio:latest-release
  #   env_file:
  #     - ./.env
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  #   command: server /data --console-address ":9001"
  #   ports:
  #     - "9000:9000" # MinIO API
  #     - "9001:9001" # MinIO Console
  #   volumes:
  #     - minio_data:/data

volumes:
  pgdata:
