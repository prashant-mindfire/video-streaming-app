# docker-compose.dev.yml

services:
  # Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
      - minio

  # Frontend    
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev
    ports:
      - "3000:3000"
    depends_on:
      - server
  
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    #environment:
      # POSTGRES_USER: postgres
      # POSTGRES_PASSWORD: password
      # POSTGRES_DB: video_streaming_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis in-memory cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # MinIO object storage
  minio:
    image: minio/minio:RELEASE.2023-09-19T23-53-00Z
    # environment:
    #   MINIO_ROOT_USER: minioadmin
    #   MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Console
    volumes:
      - minio_data:/data

volumes:
  pgdata:
  minio_data: